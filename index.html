<!DOCTYPE html>
<html>

<head>
  <title>Röve stats</title>

  <link rel="stylesheet" href="style.css">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>


<body class="bg-blue-300 min-h-screen px-4 py-6 flex flex-col items-center">
  <div class="max-w-5xl w-full mx-auto p-4 bg-white rounded-lg shadow">
    <!-- Header / search / logo -->
    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-4 gap-4">
      <h1 class="text-xl sm:text-2xl font-bold">Rödsön Veikot All-Time pistepörssi</h1>
      <img src="images/rövelogo-removebg-preview.ico" class="h-10 w-10">
      <input type="text" placeholder="Hae 🔍" oninput="handleSearch(this.value)"
        class="border px-3 py-2 rounded w-full sm:w-auto" />
    </div>

    <!-- Season selector -->
    <div class="mb-4">
      <label for="seasonDropdown" class="block mb-1 font-semibold">Valitse kausi:</label>
      <select id="seasonDropdown" class="border px-3 py-2 rounded w-full sm:w-auto">
        <option value="">All Time</option>
      </select>
    </div>

    <!-- Top seasons button -->
    <button onclick="showTopSeasons()" class="bg-blue-600 text-white px-4 py-2 rounded mb-4 w-full sm:w-auto">
      Parhaat yksilökaudet
    </button>

    <!--Back button-->
    <button onclick="goBack()" class="mb-4 px-3 py-1 bg-gray-200 rounded">
      ← Takaisin
    </button>

    <!-- Mobile sorting buttons -->
    <div id="mobile-sort" class="flex gap-2 mb-4 sm:hidden">
      <button data-key="points" data-label="Pisteet" class="bg-gray-200 px-3 py-1 rounded flex-1">Pisteet</button>

      <button data-key="goals" data-label="Maalit" class="bg-gray-200 px-3 py-1 rounded flex-1">Maalit</button>

      <button data-key="assists" data-label="Syötöt" class="bg-gray-200 px-3 py-1 rounded flex-1">Syötöt</button>
    </div>

    <!-- Table wrapper-->
    <div id="table-wrapper" class="hidden sm:block"></div>


  </div>

  <script src="index.js"></script>
</body>

</html>
